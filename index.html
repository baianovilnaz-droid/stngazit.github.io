
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBE — Социальная сеть</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>✦ VIBE</h2>
  <button id="logoutBtn" onclick="logout()" hidden>Выйти</button>
</header>

<div class="container">

  <!-- ВХОД И РЕГИСТРАЦИЯ -->
  <section id="auth">
    <h1>Добро пожаловать!</h1>
    <p>Создай аккаунт или войди в свой профиль.</p>

    <input id="email" type="email" placeholder="Электронная почта">
    <input id="password" type="password" placeholder="Пароль">
    <input id="username" placeholder="Имя пользователя">

    <button onclick="register()">Регистрация</button>
    <button onclick="login()">Войти</button>

    <p id="message"></p>
  </section>

  <!-- ГЛАВНАЯ СТРАНИЦА -->
  <main id="social" hidden>

    <h1>Твоя лента. Твой мир.</h1>
    <p>Делись своими моментами с другими людьми.</p>

    <!-- СОЗДАНИЕ ПОСТА -->
    <section class="create">
      <h3>Создать публикацию</h3>

      <textarea id="content" placeholder="Что у тебя нового?"></textarea>

      <input id="photo" type="file" accept="image/*">

      <button id="publishBtn" onclick="publish()">
        Опубликовать
      </button>
    </section>

    <h2>Последние публикации</h2>

    <div id="posts"></div>

  </main>
</div>

<!-- БИБЛИОТЕКА SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- НАШ JAVASCRIPT -->
<script src="script.js"></script>

</body>
</html>
